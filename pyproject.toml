[project]
name = "specmint"
version = "0.1.1-alpha.2"
description = "Mint language: offline compiler, CLI, editor, and Integration Protocol v0."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = "==3.12.*"
authors = [{ name = "opsdevcode" }]
dependencies = [
  "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.11.12",
  "mypy==1.15.0",
  "bandit[toml]==1.8.3",
  "pip-audit==2.9.0",
  "types-PyYAML==6.0.12.20250516",
  "build==1.2.2",
]

[project.scripts]
mint = "opsdevcode_specmint.mint.cli:main"
mint-local-sandbox = "opsdevcode_specmint.integration.reference_server:main"
specmint = "opsdevcode_specmint.cli:main"

[project.urls]
Homepage = "https://github.com/opsdevcode/specmint-language"
Documentation = "https://opsdevcode.github.io/specmint-language/"
Issues = "https://github.com/opsdevcode/specmint-language/issues"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opsdevcode_specmint = ["py.typed", "integration/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = true
mypy_path = ["src"]
packages = ["opsdevcode_specmint"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B603", "B404"]

