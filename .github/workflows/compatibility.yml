name: Compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wave2-release-pins:
    name: Wave 2 release pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Download and verify GitHub Release wheels
        env:
          LANGUAGE_TAG: v0.7.0-alpha.2
          LANGUAGE_WHEEL: specmint-0.7.0a2-py3-none-any.whl
          LOCAL_TAG: v0.2.1-alpha.1
          LOCAL_WHEEL: mint_integration_local-0.2.1a1-py3-none-any.whl
          GITHUB_TAG: v0.3.0-alpha.1
          GITHUB_WHEEL: mint_integration_github-0.3.0a1-py3-none-any.whl
        run: |
          set -euo pipefail
          fetch() {
            local repo="$1" tag="$2" dest="$3"
            mkdir -p "$dest"
            curl -fsSL "https://github.com/${repo}/releases/download/${tag}/SHA256SUMS" \
              -o "${dest}/SHA256SUMS"
            awk '{print $2}' "${dest}/SHA256SUMS" | while read -r name; do
              file="${name#./}"
              curl -fsSL "https://github.com/${repo}/releases/download/${tag}/${file}" \
                -o "${dest}/${file}"
            done
            (
              cd "$dest"
              shasum -a 256 -c SHA256SUMS
            )
          }
          fetch opsdevcode/specmint-language "$LANGUAGE_TAG" /tmp/mint-compat/language
          fetch opsdevcode/mint-integration-local "$LOCAL_TAG" /tmp/mint-compat/local
          fetch opsdevcode/mint-integration-github "$GITHUB_TAG" /tmp/mint-compat/github
      - name: Install language wheel and check local-marker
        run: |
          set -euo pipefail
          python -m venv /tmp/mint-compat/venv
          /tmp/mint-compat/venv/bin/pip install --no-cache-dir \
            /tmp/mint-compat/language/specmint-0.7.0a2-py3-none-any.whl
          /tmp/mint-compat/venv/bin/python -c \
            "from importlib.metadata import version; assert version('specmint') == '0.7.0a2'"
          /tmp/mint-compat/venv/bin/mint version
          /tmp/mint-compat/venv/bin/mint check --project examples/projects/local-marker
          /tmp/mint-compat/venv/bin/pip install --no-cache-dir \
            /tmp/mint-compat/local/mint_integration_local-0.2.1a1-py3-none-any.whl \
            /tmp/mint-compat/github/mint_integration_github-0.3.0a1-py3-none-any.whl
          /tmp/mint-compat/venv/bin/python -c \
            "from importlib.metadata import version; \
             assert version('mint-integration-local') == '0.2.1a1'; \
             assert version('mint-integration-github') == '0.3.0a1'"
