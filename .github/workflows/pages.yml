name: GitHub Pages

# Org administrators currently disable Pages site creation. Keep docs in
# /docs for when Pages is enabled. This workflow stays a no-op so CI is green.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skip:
    runs-on: ubuntu-latest
    steps:
      - name: Pages disabled at org
        run: |
          echo "GitHub Pages is disabled for the opsdevcode org."
          echo "Language docs remain in specification/mint/v0/ and docs/index.md."
