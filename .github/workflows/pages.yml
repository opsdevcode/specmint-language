name: GitHub Pages

# Canonical URLs in the artifact: https://mint.opsdevco.de/
# GitHub Pages remains a fallback mirror (opsdevcode.github.io/specmint-language).
# Cluster serving is ghcr.io/opsdevcode/mint from this Dockerfile, not Pages.
# Do not pass --cname. Do not enable Pages https_enforced as production.
# This workflow does not mutate Route53 or Pulumi. Do not add analytics.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build public docs site
        run: python3 scripts/build_docs_site.py --out site --include-tag-snapshots

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4.6.2
        with:
          name: mint-docs-site
          path: site
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4.3.0
        with:
          name: mint-docs-site
          path: site

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # actions/configure-pages@v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # actions/upload-pages-artifact@v3.0.1
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # actions/deploy-pages@v4.0.5

  preview:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4.3.0
        with:
          name: mint-docs-site
          path: site

      - name: Record preview artifact
        run: |
          echo "PR preview is the mint-docs-site artifact on this workflow run." >> "$GITHUB_STEP_SUMMARY"
          echo "Production Pages deploy runs from main only. No second analytics host." >> "$GITHUB_STEP_SUMMARY"
          echo "CNAME is omitted until mint.opsdevco.de returns anonymous HTTP 200." >> "$GITHUB_STEP_SUMMARY"
          test ! -f site/CNAME
          test -f site/versions/index.html
          test -f site/index.html
