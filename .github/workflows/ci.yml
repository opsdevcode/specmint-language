name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --no-cache-dir -e ".[dev]"
      - name: Tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q --strict-markers
      - name: Documented quickstart
        env:
          PYTHONPATH: src
        run: python -m pytest -q --strict-markers tests/test_quickstart.py

  github-assets:
    name: GitHub integration assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --no-cache-dir -e ".[dev]"
      - name: Download GitHub Release assets
        run: |
          set -euo pipefail
          download() {
            local repo="$1" tag="$2" dest="$3"
            mkdir -p "$dest"
            curl -fsSL "https://github.com/${repo}/releases/download/${tag}/SHA256SUMS" \
              -o "${dest}/SHA256SUMS"
            curl -fsSL \
              "https://raw.githubusercontent.com/${repo}/${tag}/mint-integration.json" \
              -o "${dest}/mint-integration.json"
            awk '{print $2}' "${dest}/SHA256SUMS" | while read -r name; do
              file="${name#./}"
              curl -fsSL "https://github.com/${repo}/releases/download/${tag}/${file}" \
                -o "${dest}/${file}"
            done
          }
          download opsdevcode/mint-integration-local v0.2.1-alpha.1 \
            /tmp/mint-github-assets/mint-integration-local
          download opsdevcode/mint-integration-github v0.3.0-alpha.1 \
            /tmp/mint-github-assets/mint-integration-github
      - name: Verify catalog coordinates
        env:
          PYTHONPATH: src
        run: python scripts/verify_github_integration_assets.py --assets-dir /tmp/mint-github-assets
      - name: Install verified GitHub wheels
        run: |
          set -euo pipefail
          python -m venv /tmp/mint-local-install
          /tmp/mint-local-install/bin/pip install --no-cache-dir --no-index \
            /tmp/mint-github-assets/mint-integration-local/mint_integration_local-0.2.1a1-py3-none-any.whl
          /tmp/mint-local-install/bin/python -c "from importlib.metadata import version; assert version('mint-integration-local') == '0.2.1a1'"
          python -m venv /tmp/mint-github-install
          /tmp/mint-github-install/bin/pip install --no-cache-dir --no-index \
            /tmp/mint-github-assets/mint-integration-github/mint_integration_github-0.3.0a1-py3-none-any.whl
          /tmp/mint-github-install/bin/python -c "from importlib.metadata import version; assert version('mint-integration-github') == '0.3.0a1'"

  site-image:
    name: site-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Build site image
        run: docker build -t ghcr.io/opsdevcode/mint:${{ github.sha }} .
      - name: Healthz and a11y in image
        run: |
          set -euo pipefail
          cid="$(docker run -d -p 8080:8080 ghcr.io/opsdevcode/mint:${{ github.sha }})"
          trap 'docker rm -f "${cid}"' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -qx ok
          html="$(curl -fsS http://127.0.0.1:8080/docs/quickstart/)"
          echo "${html}" | grep -q '<pre tabindex="0">'
          echo "${html}" | grep -q 'pre:focus'
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # docker/build-push-action@v7.4.0
        with:
          push: true
          tags: ghcr.io/opsdevcode/mint:${{ github.sha }}
