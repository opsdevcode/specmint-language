name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --no-cache-dir -e ".[dev]"
      - name: Tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q --strict-markers
      - name: Documented quickstart
        env:
          PYTHONPATH: src
        run: python -m pytest -q --strict-markers tests/test_quickstart.py
