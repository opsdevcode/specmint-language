name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
      - name: Install
        run: pip install --no-cache-dir -e ".[dev]"
      - name: Quality
        env:
          PYTHONPATH: src
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy src
          bandit -r src -c pyproject.toml
          python -m pytest -q
      - name: Build Python dist
        run: python -m build --sdist --wheel --outdir dist
      - name: Record dist digests
        run: |
          python - <<'PY'
          import hashlib, pathlib
          for path in sorted(pathlib.Path("dist").glob("*")):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f"{digest}  {path.name}")
          PY
      - name: Package VSIX
        working-directory: editors/vscode
        run: |
          npm ci
          npx vsce package --no-git-tag-version --no-update-package-json
          mkdir -p ../../dist
          mv *.vsix ../../dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --title "Mint ${TAG#v}" \
            --notes "Mint language ${TAG}. Offline compiler, CLI, and editor. mint apply is not included." \
            dist/*
      - name: Publish PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe1288c7f4c4b0c8 # v1.12.4
        continue-on-error: true
      - name: Publish VS Code Marketplace
        if: ${{ secrets.VSCE_PAT != '' }}
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath ../../dist/*.vsix
        continue-on-error: true
      - name: Publish Open VSX
        if: ${{ secrets.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish dist/*.vsix --pat "${OVSX_PAT}"
        continue-on-error: true
